<div class="page-suppliers">
  <!-- Top actions -->
  <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px;" class="no-print">
    <button class="btn-submit" id="btn-add-supplier" style="flex:1; min-width: 150px; padding: 12px; font-size: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">➕ إضافة مورد</button>
    <button class="btn-secondary" id="btn-all-suppliers-report" style="flex:1; min-width: 150px; padding: 12px; font-size: 15px; background-color: #334155; color: white; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s;">📄 كشف عام للموردين</button>
    <div style="position: relative; flex:2; min-width: 200px;">
      <input type="text" id="select-supplier-input" class="form-control" placeholder="🔍 ابحث أو اختر المورد..." style="width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; border: 1px solid #cbd5e1;" autocomplete="off">
      <div id="supplier-dropdown-list" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); max-height: 250px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius: 4px;"></div>
    </div>
  </div>

  <!-- Supplier Management Panel -->
  <div id="supplier-management-panel" style="display:none;">
    
    <!-- Transactions Input -->
    <div class="cashier-card no-print" style="margin-bottom: 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <div class="card-label" style="font-size:13px; color:var(--lahmi2)"><span>📝 تسجيل حركة للمورد</span></div>
        <div style="display:flex; gap:5px;">
          <button class="btn-secondary" style="padding:4px 8px; font-size:11px;" id="btn-edit-supplier">✏️ تعديل</button>
          <button class="btn-primary" style="padding:4px 8px; font-size:11px;" id="btn-archive-supplier">📦 أرشيف</button>
          <button class="btn-danger" style="padding:4px 8px; font-size:11px;" id="btn-delete-supplier">🗑️ حذف</button>
        </div>
      </div>
      
      <div class="form-grid" style="margin-bottom: 15px;">
        <div class="form-group">
          <label class="form-label">التاريخ</label>
          <input type="date" id="sup-tx-date" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">نوع العملية</label>
          <select id="sup-tx-type" class="form-control">
            <option value="له">له (فاتورة / دين علينا)</option>
            <option value="عليه">عليه (دفعة نقدية / سند صرف)</option>
            <option value="خصم">خصم مكتسب / تسوية فاتورة (لا يؤثر على الصندوق)</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">المبلغ (฿)</label>
          <input type="number" id="sup-tx-amount" class="form-control" step="any" value="0">
        </div>
        <div class="form-group">
          <label class="form-label">طريقة الدفع (الحساب)</label>
          <select id="sup-tx-account" class="form-control account-dropdown"></select>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label class="form-label">التفاصيل / ملاحظات</label>
          <input type="text" id="sup-tx-notes" class="form-control" placeholder="تفاصيل الحركة">
        </div>
      </div>
      
      <div style="display:flex; gap:10px; align-items:flex-end;">
        <button class="btn-submit" id="btn-save-supplier-tx" style="flex:1;"><span>💾 حفظ الحركة</span></button>
      </div>
      <div style="display:flex; gap:10px; align-items:flex-end; margin-top:15px; padding-top:15px; border-top:1px dashed #d8d0c1;">
        <div style="flex:1;">
          <label class="form-label" style="font-size:12px; font-weight:normal;">من تاريخ (اختياري)</label>
          <input type="date" id="sup-print-from" class="form-control" style="font-size:13px; padding:5px;">
        </div>
        <div style="flex:1;">
          <label class="form-label" style="font-size:12px; font-weight:normal;">إلى تاريخ (اختياري)</label>
          <input type="date" id="sup-print-to" class="form-control" style="font-size:13px; padding:5px;">
        </div>
        <button class="btn-secondary" id="btn-print-supplier-statement" style="flex:1;"><span>🖨️ كشف حساب</span></button>
      </div>
    </div>

    <!-- Transactions History Table -->
    <div class="table-container">
      <table class="report-table professional-table">
        <thead>
          <tr>
            <th class="table-header">م</th>
            <th class="table-header">التاريخ</th>
            <th class="table-header">النوع</th>
            <th class="table-header">المبلغ</th>
            <th class="table-header">التفاصيل</th>
            <th class="table-header no-print">خيارات</th>
          </tr>
        </thead>
        <tbody id="sup-tx-tbody">
          <!-- Dynamic Data -->
        </tbody>
      </table>
    </div>

  </div>
</div>
